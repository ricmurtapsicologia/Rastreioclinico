name: Sanitize screening v5
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sanitize-screening-v5.yml']
permissions: {contents: write}
env:
  CANONICAL_NAME: 'RAC-5TR'
  HERO_ID: 'geral'
jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover duplicidades e metadados visuais legados
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re,json,pathlib
          p=pathlib.Path('index.html'); s=p.read_text(encoding='utf-8'); before=s
          name=os.environ['CANONICAL_NAME']; hid=os.environ['HERO_ID']; hero=f'https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/assets/heroes/{hid}.jpg?v=5.0.0'
          s,nhead=re.subn(r'(?is)(<body\b[^>]*>\s*)<header\b[^>]*>.*?</header>',r'\1',s,count=1)
          s=re.sub(r'(?is)<section\b[^>]*class=["\'][^"\']*(?:legacy-hero|hero-banner|instrument-hero)[^"\']*["\'][^>]*>.*?</section>','',s)
          s=re.sub(r'(?is)<title>.*?</title>',f'<title>{name}</title>',s,count=1)
          def meta(prop,val):
            global s
            pat=rf'(?is)<meta\b([^>]*?(?:property|name)=["\']{re.escape(prop)}["\'][^>]*?)>'
            m=re.search(pat,s)
            tag=f'<meta property="{prop}" content="{val}"/>' if prop.startswith('og:') else f'<meta name="{prop}" content="{val}"/>'
            if m:s=s[:m.start()]+tag+s[m.end():]
            else:s=s.replace('</head>',tag+'\n</head>',1)
          meta('og:title',name);meta('og:image',hero);meta('twitter:title',name);meta('twitter:image',hero)
          s=re.sub(r'(screening-uniformity-v1\.(?:css|js))\?v=[^"\']+',r'\1?v=5.0.0',s)
          p.write_text(s,encoding='utf-8')
          pathlib.Path('audits').mkdir(exist_ok=True)
          refs=re.findall(r'https?://[^"\'\s)]+',s)
          audit={'version':'5.0.0','instrument':hid,'canonicalName':name,'legacyTopHeaderRemoved':bool(nhead),'canonicalHero':hero,'oldHeroHostsRemaining':[x for x in refs if any(h in x for h in ('pinimg.com','images.unsplash.com','pexels.com','pixabay.com')) and ('hero' in x.lower() or 'banner' in x.lower())]}
          pathlib.Path('audits/visual-sanitize-v5.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Gate
        run: |
          grep -q 'screening-uniformity-v1.css?v=5.0.0' index.html
          grep -q 'assets/heroes/geral.jpg?v=5.0.0' index.html
      - name: Commit
        run: |
          rm -f .github/workflows/sanitize-screening-v5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore(rastreio): remove header/hero legado e alinha naming v5'
          git push
