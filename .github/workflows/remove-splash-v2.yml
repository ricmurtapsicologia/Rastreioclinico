name: Remover splash v2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-splash-v2.yml']
permissions:
  contents: write
jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Remove splash without touching questionnaire
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          before=s
          s=re.sub(r'\s*/\*\s*Splash\s*\*/\s*#splash\s*\{.*?\}\s*#splash\.hidden\s*\{.*?\}\s*@keyframes\s+fadeOut\s*\{.*?\}\s*', '\n', s, count=1, flags=re.S|re.I)
          s=re.sub(r'\s*<div\s+id=["\']splash["\'][^>]*>.*?</div>\s*', '\n', s, count=1, flags=re.S|re.I)
          s=s.replace('<main id="mainContent" class="container"', '<main id="mainContent" class="container show"', 1)
          s=re.sub(r'\s*//\s*Splash\s*→\s*conteúdo\s*setTimeout\(\(\)\s*=>\s*\{\s*splash\.classList\.add\(["\']hidden["\']\);\s*main\.classList\.add\(["\']show["\']\);\s*\},\s*2000\);\s*', '\n', s, count=1, flags=re.S|re.I)
          s=re.sub(r"\s*const\s+splash\s*=\s*document\.getElementById\(['\"]splash['\"]\);", '', s, count=1)
          if s==before: raise SystemExit('NO_SPLASH_CHANGE')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Contract check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          forbidden=[r'id=["\']splash',r'#splash',r'splash\.classList']
          for pattern in forbidden:
              if re.search(pattern,s,re.I): raise SystemExit('SPLASH_RESIDUE:'+pattern)
          if 'id="mainContent" class="container show"' not in s: raise SystemExit('MAIN_NOT_VISIBLE')
          if 'id="btnCorrigir"' not in s: raise SystemExit('QUESTIONNAIRE_ACTION_MISSING')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove splash e abre diretamente no rastreio'
          git push
