name: Aplicar padrão ICAPS aos rastreios

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-screening-uniformity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject shared design system without changing questionnaire content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          original=html
          css='  <link rel="stylesheet" href="https://ricmurtapsicologia.github.io/plataforma.terapeutica/assets/css/screening-uniformity-v1.css?v=1.0.0">\n'
          js='  <script src="https://ricmurtapsicologia.github.io/plataforma.terapeutica/assets/js/screening-uniformity-v1.js?v=1.0.0" defer></script>\n'
          if 'screening-uniformity-v1.css' not in html:
              if '</head>' not in html: raise SystemExit('HEAD_END_NOT_FOUND')
              html=html.replace('</head>',css+'</head>',1)
          if 'screening-uniformity-v1.js' not in html:
              if '</body>' not in html: raise SystemExit('BODY_END_NOT_FOUND')
              html=html.replace('</body>',js+'</body>',1)
          if html==original: raise SystemExit('ALREADY_APPLIED')
          p.write_text(html,encoding='utf-8')
          PY
      - name: Verify only shared references were introduced
        shell: bash
        run: |
          grep -q 'screening-uniformity-v1.css' index.html
          grep -q 'screening-uniformity-v1.js' index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Aplica experiência visual unificada de rastreio'
          git push
