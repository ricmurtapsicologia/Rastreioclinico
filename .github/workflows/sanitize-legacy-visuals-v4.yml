name: Sanitize legacy visuals v4
on:
  push:
    paths: ['.github/workflows/sanitize-legacy-visuals-v4.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sanitize:
    runs-on: ubuntu-latest
    env:
      INSTRUMENT_ID: geral
      CANONICAL_TITLE: 'RAC-5TR — Rastreio Autoaplicável Clínico'
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet beautifulsoup4
      - name: Remover apresentação visual legada
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from bs4 import BeautifulSoup
          p=Path('index.html'); raw=p.read_text(encoding='utf-8')
          before={'pinimg':len(re.findall(r'pinimg\.com',raw,re.I)),'unsplash':len(re.findall(r'(?:images\.)?unsplash\.com',raw,re.I)),'splash':len(re.findall(r'\bsplash\b',raw,re.I))}
          title=os.environ['CANONICAL_TITLE']; iid=os.environ['INSTRUMENT_ID']; hero=f'https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/assets/heroes/{iid}.jpg?v=4.0.0'
          soup=BeautifulSoup(raw,'html.parser')
          if soup.title: soup.title.string=title
          for prop in ('og:title','twitter:title'):
              for m in soup.find_all('meta',attrs={'property':prop})+soup.find_all('meta',attrs={'name':prop}): m['content']=title
          for prop in ('og:image','twitter:image'):
              for m in soup.find_all('meta',attrs={'property':prop})+soup.find_all('meta',attrs={'name':prop}): m['content']=hero
          for m in soup.find_all('meta',attrs={'property':'og:image:alt'})+soup.find_all('meta',attrs={'name':'twitter:image:alt'}): m['content']=f'Hero clínico — {title}'
          for l in soup.find_all('link',href=re.compile(r'pinimg\.com',re.I)):
              if 'icon' in (l.get('rel') or []): l.decompose()
          def classes(tag): return ' '.join(tag.get('class') or []).lower()
          for tag in list(soup.find_all(True)):
              c=classes(tag); ident=(tag.get('id') or '').lower()
              if ('splash' in c or 'splash' in ident) and 'rmclinical' not in ident: tag.decompose(); continue
              if 'panic-fab' in c: tag.decompose(); continue
              if tag.name in ('section','div') and any(x in c for x in ('hero','banner-wrap','legacy-hero','instrument-hero','hero-image','banner-image')) and 'rm-screening' not in c:
                  tag.decompose(); continue
              if tag.name=='header' and tag.find(class_=re.compile(r'(^|\s)banner(\s|$)',re.I)): tag.decompose(); continue
              if tag.name=='img':
                  src=str(tag.get('src') or '')
                  if re.search(r'pinimg\.com|(?:images\.)?unsplash\.com',src,re.I):
                      host=tag.find_parent(class_=re.compile(r'hero|banner|cover',re.I))
                      if host: host.decompose()
                      elif re.search(r'banner|hero|rastreio|instrumento',str(tag.get('alt') or ''),re.I): tag.decompose()
          out=str(soup)
          out=re.sub(r'url\((?:["\']?)(?:https?:)?//(?:i\.)?pinimg\.com/[^)]+\)', 'none', out, flags=re.I)
          out=re.sub(r'url\((?:["\']?)https://images\.unsplash\.com/[^)]+\)', 'none', out, flags=re.I)
          out=re.sub(r'https?://(?:i\.)?pinimg\.com/[^"\'\s<>)]+', hero, out, flags=re.I)
          out=re.sub(r'https://images\.unsplash\.com/[^"\'\s<>)]+', hero, out, flags=re.I)
          out=re.sub(r'screening-uniformity-v1\.css\?v=[^"\']+', 'screening-uniformity-v1.css?v=4.0.0', out)
          out=re.sub(r'screening-uniformity-v1\.js\?v=[^"\']+', 'screening-uniformity-v1.js?v=4.0.0', out)
          out=out.replace('modeToggle.addEventListener','modeToggle?.addEventListener').replace('darkModeToggle.addEventListener','darkModeToggle?.addEventListener')
          p.write_text(out,encoding='utf-8')
          after={'pinimg':len(re.findall(r'pinimg\.com',out,re.I)),'unsplash':len(re.findall(r'(?:images\.)?unsplash\.com',out,re.I)),'splash':len(re.findall(r'\bsplash\b',out,re.I))}
          Path('audits').mkdir(exist_ok=True)
          Path('audits/visual-sanitize-v4.json').write_text(json.dumps({'instrument':iid,'title':title,'before':before,'after':after,'canonicalHero':hero},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          find . -type f \( -iname '*hero*.jpg' -o -iname '*hero*.jpeg' -o -iname '*hero*.png' -o -iname '*hero*.webp' -o -iname '*banner*.jpg' -o -iname '*banner*.jpeg' -o -iname '*banner*.png' -o -iname '*banner*.webp' -o -iname '*splash*.jpg' -o -iname '*splash*.png' -o -iname '*splash*.webp' \) ! -path './.git/*' ! -path './.github/*' -print0 | xargs -0 -r git rm -f --ignore-unmatch
          ! grep -qiE 'pinimg\.com|images\.unsplash\.com' index.html
          grep -q 'screening-uniformity-v1.css?v=4.0.0' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore(visual): remover resíduos de hero/banner legado e alinhar v4'
          git push
